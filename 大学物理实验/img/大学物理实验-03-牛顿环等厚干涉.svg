<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 0 404 242" width="480" height="288" data-profile="freeform" role="img" aria-labelledby="t3 d3">
  <title id="t3">牛顿环等厚干涉的空气膜几何</title>
  <desc id="d3">平凸透镜的凸面与平面玻璃板之间夹出一层空气薄膜，接触点为 O，球心为 C。距轴 r_k 处膜厚为 e，球心 C、该点与转轴构成直角三角形：斜边 R、竖直边 R−e、水平边 r_k。</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="dimEnd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b"/>
    </marker>
    <marker id="dimStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="520" height="280" fill="#ffffff"/>

  <g data-role="body">
    <path d="M95,200 L95,100 A170,170 0 0 0 405,100 L405,200 Z" fill="#176b9c" fill-opacity="0.10" stroke="none"/>
    <path d="M95,100 L405,100 A170,170 0 0 1 95,100 Z" fill="#f8fafc" stroke="#243746" stroke-width="1.5"/>
    <rect x="80" y="200" width="360" height="20" fill="#f8fafc" stroke="#243746" stroke-width="1.5"/>
  </g>

  <g data-role="auxiliary" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3">
    <path d="M250,22 V200"/>
    <path d="M250,150 H370"/>
  </g>

  <g data-role="construction" fill="none" stroke="#243746">
    <path d="M250,30 L370,150" stroke-width="1.5"/>
    <path d="M250,142 H258 V150" stroke-width="1.2"/>
  </g>

  <path d="M370,150 V200" fill="none" stroke="#64748b" stroke-width="1" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>

  <g data-role="points" fill="#243746">
    <circle cx="250" cy="30" r="2.5"/>
    <circle cx="250" cy="200" r="2.5"/>
    <circle cx="370" cy="150" r="2.5"/>
  </g>

  <g data-role="labels" fill="#183047" font-size="11">
    <text x="258" y="34">C（球心）</text>
    <text x="242" y="192" text-anchor="end">O</text>
    <text x="330" y="86" font-style="italic">R</text>
    <text x="242" y="92" text-anchor="end" font-style="italic">R−e</text>
    <text x="310" y="170" font-style="italic">r<tspan baseline-shift="sub" font-size="8">k</tspan></text>
    <text x="380" y="178" font-style="italic">e</text>
  </g>
</svg>
