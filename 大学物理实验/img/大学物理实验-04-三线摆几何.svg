<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 596 311" width="596" height="311" data-profile="freeform" role="img" aria-labelledby="t4 d4">
  <title id="t4">三线摆的几何关系</title>
  <desc id="d4">（a）侧视：悬线长 L 不变，上悬点到轴的距离为 r，下悬点到轴的距离为 R，静止时两盘的垂直距离为 H，下盘转过 θ0 后抬高 h。（b）俯视：下盘转过 θ0 后，上、下悬点不再共线，水平距离由 R−r 增大为对应弦长。</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="dimEnd4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b"/>
    </marker>
    <marker id="dimStart4" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="316" fill="#ffffff"/>

  <g data-role="panel-a">
    <rect x="120" y="52" width="90" height="8" fill="#f8fafc" stroke="#243746" stroke-width="1.5"/>
    <rect x="55" y="224" width="220" height="8" fill="#f8fafc" stroke="#243746" stroke-width="1.5"/>
    <rect x="55" y="200" width="220" height="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M120,60 L55,224" fill="none" stroke="#243746" stroke-width="1.5"/>
    <path d="M165,28 V250" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M120,60 V224" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M120,44 H165" fill="none" stroke="#64748b" stroke-width="1" marker-start="url(#dimStart4)" marker-end="url(#dimEnd4)"/>
    <path d="M55,246 H165" fill="none" stroke="#64748b" stroke-width="1" marker-start="url(#dimStart4)" marker-end="url(#dimEnd4)"/>
    <path d="M47,200 V224" fill="none" stroke="#64748b" stroke-width="1" marker-start="url(#dimStart4)" marker-end="url(#dimEnd4)"/>
    <circle cx="120" cy="60" r="2.5" fill="#243746"/>
    <circle cx="55" cy="224" r="2.5" fill="#243746"/>
  </g>

  <g data-role="panel-b">
    <circle cx="470" cy="150" r="100" fill="none" stroke="#243746" stroke-width="1.5"/>
    <circle cx="470" cy="150" r="45" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M470,150 H515" fill="none" stroke="#243746" stroke-width="1.5"/>
    <path d="M470,150 L558,197" fill="none" stroke="#243746" stroke-width="1.5"/>
    <path d="M500,150 A30,30 0 0 1 496,164" fill="none" stroke="#176b9c" stroke-width="1.2"/>
    <circle cx="470" cy="150" r="2.5" fill="#243746"/>
    <circle cx="515" cy="150" r="2.5" fill="#243746"/>
    <circle cx="558" cy="197" r="2.5" fill="#243746"/>
  </g>

  <g data-role="labels" fill="#183047" font-size="11">
    <text x="142" y="36" text-anchor="middle" font-style="italic">r</text>
    <text x="110" y="262" text-anchor="middle" font-style="italic">R</text>
    <text x="128" y="146" font-style="italic">H</text>
    <text x="66" y="140" font-style="italic">L</text>
    <text x="38" y="216" text-anchor="end" font-style="italic">h</text>
    <text x="222" y="60">上盘</text>
    <text x="287" y="232">下盘</text>
    <text x="492" y="142" font-style="italic">r</text>
    <text x="536" y="170" font-style="italic">R</text>
    <text x="511" y="164" text-anchor="middle" font-style="italic" fill="#176b9c">θ<tspan baseline-shift="sub" font-size="8">0</tspan></text>
    <text x="462" y="146" text-anchor="end">转轴</text>
  </g>

  <g data-role="titles" fill="#64748b" font-size="10">
    <text x="165" y="292" text-anchor="middle">（a）侧视：L² = H² + (R−r)²，下盘转过 θ0 后抬高 h</text>
    <text x="470" y="292" text-anchor="middle">（b）俯视：转过 θ0 后上、下悬点的水平距离变大</text>
  </g>
</svg>
