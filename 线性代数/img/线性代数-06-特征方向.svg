<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-profile="freeform" viewBox="78 0 294 338" width="294" height="338" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">特征向量的方向不变</title>
  <desc id="fig-desc">矩阵 A 把向量 v 映成 3v，把向量 w 映成自身；这两个方向是特征向量方向，其他方向一般会转动。</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <rect x="78" y="0" width="294" height="338" fill="#ffffff"/>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#243746"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#176b9c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#167c80"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#d17518"/>
    </marker>
  </defs>

  <text x="240" y="36" text-anchor="middle" font-size="15" fill="#183047">特征向量方向不变</text>

  <g data-role="eigen-lines" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3">
    <path d="M100,260 L300,60"/>
    <path d="M100,100 L300,300"/>
  </g>
  <circle cx="180" cy="180" r="3" fill="#243746"/>

  <g data-role="vectors" fill="none" stroke-width="1.8">
    <path d="M180,180 L300,60" stroke="#d17518" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <path d="M180,180 L220,140" stroke="#176b9c" marker-end="url(#arrow-blue)"/>
    <path d="M180,180 L220,220" stroke="#167c80" marker-end="url(#arrow-teal)"/>
  </g>

  <g data-role="labels" fill="#183047" font-size="11">
    <text x="228" y="132" fill="#176b9c" font-style="italic">v</text>
    <text x="308" y="52" fill="#d17518">3<tspan font-style="italic">v</tspan> = A<tspan font-style="italic">v</tspan></text>
    <text x="228" y="234" fill="#167c80" font-style="italic">w</text>
    <text x="228" y="250" fill="#167c80">A<tspan font-style="italic">w</tspan> = <tspan font-style="italic">w</tspan></text>
    <text x="240" y="312" text-anchor="middle" fill="#64748b">A 把特征方向上的向量按特征值伸缩</text>
  </g>
</svg>
