<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-profile="freeform" viewBox="118 0 332 338" width="332" height="338" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个基本子空间</title>
  <desc id="fig-desc">行空间与零空间拼成 R^n，列空间与左零空间拼成 R^m；行空间与列空间的维数都等于秩 r，A 把行空间一一映到列空间。</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <rect x="118" y="0" width="332" height="338" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#176b9c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="284" y="36" text-anchor="middle" font-size="15" fill="#183047">四个基本子空间与秩</text>

  <text x="140" y="86" font-size="11" fill="#64748b">R<tspan baseline-shift="super" font-size="8">n</tspan>（n = 6）</text>
  <g data-role="top-bar">
    <rect x="140" y="100" width="144" height="56" fill="#fbf1e6" stroke="#d17518" stroke-width="1.5"/>
    <rect x="284" y="100" width="144" height="56" fill="#e9f1f6" stroke="#176b9c" stroke-width="1.5"/>
  </g>
  <g data-role="top-labels" text-anchor="middle" fill="#183047">
    <text x="212" y="122" font-size="11">行空间 C(A<tspan baseline-shift="super" font-size="8">T</tspan>)</text>
    <text x="212" y="140" font-size="10" fill="#64748b">dim = r</text>
    <text x="356" y="122" font-size="11">零空间 N(A)</text>
    <text x="356" y="140" font-size="10" fill="#64748b">dim = n − r</text>
  </g>

  <text x="140" y="208" font-size="11" fill="#64748b">R<tspan baseline-shift="super" font-size="8">m</tspan>（m = 5）</text>
  <g data-role="bottom-bar">
    <rect x="140" y="220" width="144" height="56" fill="#fbf1e6" stroke="#d17518" stroke-width="1.5"/>
    <rect x="284" y="220" width="96" height="56" fill="#e9f1f6" stroke="#176b9c" stroke-width="1.5"/>
  </g>
  <g data-role="bottom-labels" text-anchor="middle" fill="#183047">
    <text x="212" y="242" font-size="11">列空间 C(A)</text>
    <text x="212" y="260" font-size="10" fill="#64748b">dim = r</text>
    <text x="332" y="238" font-size="10">左零空间</text>
    <text x="332" y="252" font-size="10">N(A<tspan baseline-shift="super" font-size="8">T</tspan>)</text>
    <text x="332" y="268" font-size="10" fill="#64748b">dim = m − r</text>
  </g>

  <g data-role="maps" fill="none">
    <path d="M212,156 V220" stroke="#176b9c" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <path d="M356,156 V186" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"/>
  </g>
  <text x="220" y="192" font-size="11" fill="#176b9c" font-style="italic">A</text>
  <circle cx="356" cy="192" r="2.5" fill="#64748b"/>
  <text x="364" y="196" font-size="11" fill="#64748b">0</text>

  <text x="284" y="314" text-anchor="middle" font-size="10" fill="#64748b">行空间 ⊕ 零空间 = R<tspan baseline-shift="super" font-size="7">n</tspan>；列空间 ⊕ 左零空间 = R<tspan baseline-shift="super" font-size="7">m</tspan></text>
</svg>
