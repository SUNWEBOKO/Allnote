    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <rect x="98" y="0" width="377" height="296" fill="#ffffff"/>

  <text x="298" y="36" text-anchor="middle" font-size="15" fill="#183047">行最简形：主元列与自由列</text>

  <g data-role="column-status" font-size="10" text-anchor="middle">
    <text x="142" y="62" fill="#d17518">主元</text>
    <text x="186" y="62" fill="#176b9c">自由</text>
    <text x="230" y="62" fill="#d17518">主元</text>
    <text x="274" y="62" fill="#176b9c">自由</text>
    <text x="318" y="62" fill="#d17518">主元</text>
  </g>

  <g data-role="column-shading">
    <rect x="120" y="96" width="44" height="144" fill="#fbf1e6"/>
    <rect x="208" y="96" width="44" height="144" fill="#fbf1e6"/>
    <rect x="296" y="96" width="44" height="144" fill="#fbf1e6"/>
    <rect x="164" y="96" width="44" height="144" fill="#e9f1f6"/>
    <rect x="252" y="96" width="44" height="144" fill="#e9f1f6"/>
  </g>

