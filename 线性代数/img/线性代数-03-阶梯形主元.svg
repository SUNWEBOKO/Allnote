<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-profile="freeform" viewBox="98 0 377 296" width="377" height="296" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">行最简形的主元列与自由列</title>
  <desc id="fig-desc">一个 4 行 5 列的行最简形矩阵，第 1、3、5 列是主元列，第 2、4 列是自由列；非零行有 3 行，所以秩为 3，自由变量有 2 个。</desc>
